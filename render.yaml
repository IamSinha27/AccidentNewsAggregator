# Render Blueprint: Postgres + the FastAPI web service + the daily pipeline cron.
# The Next.js frontend is deployed separately on Vercel (root directory: frontend/).

databases:
  - name: accident-news-db
    plan: free            # free Postgres expires 30 days after creation; move to a paid plan to keep the data
    postgresMajorVersion: "16"

services:
  - type: web
    name: accident-news-api
    runtime: python
    plan: free            # sleeps when idle; the first request after a pause takes up to a minute
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: accident-news-db
          property: connectionString
      - key: CORS_ORIGINS   # the Vercel URL of the frontend, e.g. https://your-app.vercel.app
        sync: false

  - type: cron
    name: accident-news-pipeline
    runtime: python
    plan: 0.5c-512mb      # cron jobs have no free plan
    rootDir: backend
    schedule: "0 18 * * *"  # 18:00 UTC = 23:30 IST, when most of the day's news is in
    buildCommand: pip install -r requirements.txt
    startCommand: python run_pipeline.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: accident-news-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
